name: Snyk Security Scan

on:
  pull_request:
    branches: ["**"]

concurrency:
  group: snyk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snyk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Snyk CLI
        run: |
          curl -sL https://static.snyk.io/cli/latest/snyk-linux -o snyk
          chmod +x snyk
          sudo mv snyk /usr/local/bin/

      - name: Run Snyk open source scan
        id: snyk_oss
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test \
            --org=${{ vars.SNYK_ORG_ID }} \
            --severity-threshold=medium \
            --json > snyk-oss-results.json 2>&1 || true

      - name: Run Snyk code scan
        id: snyk_code
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk code test \
            --org=${{ vars.SNYK_ORG_ID }} \
            --json > snyk-code-results.json 2>&1 || true

      - name: Post results as PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            function parseSeverityCounts(vulns) {
              return vulns.reduce((acc, v) => {
                const sev = (v.severity || 'unknown').toLowerCase();
                acc[sev] = (acc[sev] || 0) + 1;
                return acc;
              }, {});
            }

            function severitySummary(counts) {
              const order = ['critical', 'high', 'medium', 'low'];
              return order
                .filter(s => counts[s])
                .map(s => `${s}: ${counts[s]}`)
                .join(' | ') || 'none';
            }

            function buildOssSection(filePath) {
              try {
                const raw = fs.readFileSync(filePath, 'utf8');
                const result = JSON.parse(raw);
                const vulns = result.vulnerabilities || [];

                if (vulns.length === 0) {
                  return '### Open Source Dependencies\n**Status:** PASS — no vulnerabilities at or above threshold.\n';
                }

                const counts = parseSeverityCounts(vulns);
                let section = `### Open Source Dependencies\n`;
                section += `**Status:** FAIL — ${vulns.length} vulnerabilities found. ${severitySummary(counts)}\n\n`;
                section += '| Severity | Package | Installed | Fix Available | Title |\n';
                section += '|---|---|---|---|---|\n';

                vulns.slice(0, 20).forEach(v => {
                  const fix = v.fixedIn?.length ? v.fixedIn[0] : 'None';
                  section += `| ${v.severity} | ${v.packageName} | ${v.version} | ${fix} | ${v.title} |\n`;
                });

                if (vulns.length > 20) {
                  section += `\n_${vulns.length - 20} additional findings omitted._\n`;
                }
                return section;
              } catch (e) {
                return `### Open Source Dependencies\nCould not parse results: ${e.message}\n`;
              }
            }

            function buildCodeSection(filePath) {
              try {
                const raw = fs.readFileSync(filePath, 'utf8');
                const result = JSON.parse(raw);
                const runs = result.runs || [];
                const findings = runs.flatMap(r => r.results || []);

                if (findings.length === 0) {
                  return '### Snyk Code (SAST)\n**Status:** PASS — no issues found.\n';
                }

                let section = `### Snyk Code (SAST)\n`;
                section += `**Status:** FAIL — ${findings.length} issues found.\n\n`;
                section += '| Severity | Rule | File | Line |\n';
                section += '|---|---|---|---|\n';

                findings.slice(0, 20).forEach(f => {
                  const sev = f.level || 'unknown';
                  const rule = f.ruleId || 'unknown';
                  const loc = f.locations?.[0]?.physicalLocation;
                  const file = loc?.artifactLocation?.uri || 'unknown';
                  const line = loc?.region?.startLine || '-';
                  section += `| ${sev} | ${rule} | ${file} | ${line} |\n`;
                });

                if (findings.length > 20) {
                  section += `\n_${findings.length - 20} additional findings omitted._\n`;
                }
                return section;
              } catch (e) {
                return `### Snyk Code (SAST)\nCould not parse results: ${e.message}\n`;
              }
            }

            const ossSection = buildOssSection('snyk-oss-results.json');
            const codeSection = buildCodeSection('snyk-code-results.json');

            const body = [
              '## Snyk Security Scan',
              `_Commit: \`${context.payload.pull_request.head.sha}\` | PR: #${context.issue.number}_`,
              '',
              ossSection,
              '',
              codeSection,
            ].join('\n');

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            for (const comment of comments.data) {
              if (comment.body.startsWith('## Snyk Security Scan')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
