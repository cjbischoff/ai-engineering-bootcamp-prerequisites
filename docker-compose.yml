# Secret injection: .env may hold `op://...` references. Docker does not resolve those.
# Compose substitutes ${VAR} from the host environment first, then from the project .env file.
# Run `op run --env-file=".env" -- docker compose ...` (see Makefile) so the host has real values.

x-secret-env: &secret-env
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  GOOGLE_API_KEY: ${GOOGLE_API_KEY}
  GROQ_API_KEY: ${GROQ_API_KEY}
  LANGSMITH_API_KEY: ${LANGSMITH_API_KEY}
  COHERE_API_KEY: ${COHERE_API_KEY}
  HF_TOKEN: ${HF_TOKEN}

services:
  # Run Service
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - 8000:8000
    env_file:
      - .env
    environment:
      <<: *secret-env
    restart: unless-stopped
    volumes:
      - ./apps/api/src:/app/apps/api/src

  # Run Service
  streamlit-app:
    build:
      context: .
      dockerfile: apps/chatbot_ui/Dockerfile
    ports:
      - 8501:8501
    env_file:
      - .env
    environment:
      <<: *secret-env
    restart: unless-stopped
    volumes:
      - ./apps/chatbot_ui/src:/app/apps/chatbot_ui/src

  qdrant:
    image: qdrant/qdrant
    ports:
      - 6333:6333
      - 6334:6334
    volumes:
      - ./qdrant_storage:/qdrant/storage:z
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - 5433:5432
    environment:
      POSTGRES_DB: langgraph_db
      POSTGRES_USER: langgraph_user
      POSTGRES_PASSWORD: langgraph_password
      PGDATA: /var/lib/postgresql/data/pgdata
    restart: unless-stopped
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  items_mcp_server:
    build:
      context: .
      dockerfile: apps/items_mcp_server/Dockerfile
    ports:
      - 8001:8000
    env_file:
      - .env
    environment:
      <<: *secret-env
    restart: unless-stopped

  reviews_mcp_server:
    build:
      context: .
      dockerfile: apps/reviews_mcp_server/Dockerfile
    ports:
      - 8002:8000
    env_file:
      - .env
    environment:
      <<: *secret-env
    restart: unless-stopped
